<!DOCTYPE html>
<html>
<head>
    <title>所有使用者資料</title>
    <style>
        body { background-color: #d4f8e8; font-family: sans-serif; padding: 20px; }
        .card { background-color: white; border: 1px solid #000; border-radius: 8px; padding: 15px; margin-bottom: 15px; }
        .btn { padding: 5px 10px; margin-right: 5px; }
    </style>
</head>
<body>
    <h1>個人小檔案列表</h1>
    {% for item in profiles %}
    <div class="card">
        <p><strong>姓名：</strong> {{ item.username }}</p>
        <p><strong>性別：</strong> {{ item.usersex }}</p>
        <p><strong>學歷：</strong> {{ item.userschool }}</p>
        <p><strong>興趣：</strong></p>
        <ul>
            {% for interest in item.interests %}
            <li>{{ interest }}</li>
            {% endfor %}
        </ul>
        <p><strong>看法為：</strong><br>{{ item.userthought }}</p>
    </div>
    {% endfor %}

    <div>
        <a href="/homework3/"><button class="btn">回首頁</button></a>
        <a href="/show_all/"><button class="btn">查看所有資料</button></a>
    </div>
</body>
</html>
